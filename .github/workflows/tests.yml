name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      ONCA_GUI_TESTS: '1'
      UV_PYTHON_INSTALL_DIR: ${{ runner.temp }}/onca-python
      UV_CACHE_DIR: ${{ runner.temp }}/uv-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          # Bootstrap only: recent 3.11 Windows builds are provided by uv.
          python-version: '3.11.9'
      - name: Prepare validated Python
        shell: pwsh
        run: |
          python -m pip install uv==0.12.23
          uv python install 3.11.17 --no-bin
          uv venv .venv --python 3.11.17 --managed-python --seed
          "$env:GITHUB_WORKSPACE/.venv/Scripts" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - run: python --version
      - run: python -m pip install -r requirements.txt
      - run: python -m pip check
      - run: python tools/public_snapshot.py --check
      - run: python -m compileall -q app run.py tools tests
      - run: python -m unittest discover -s tests -v
      - run: python tools/smoke_test.py
      - run: python tools/check_query_plans.py
