name: Build Windows (review artifact)
on:
  workflow_dispatch:
    inputs:
      approved_build:
        description: 'Owner approved this reviewed source for a build (no publication)'
        required: true
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      ONCA_GUI_TESTS: '1'
      UV_PYTHON_INSTALL_DIR: ${{ runner.temp }}/onca-python
      UV_CACHE_DIR: ${{ runner.temp }}/uv-cache
    steps:
      - name: Require build approval
        if: ${{ !inputs.approved_build }}
        shell: pwsh
        run: throw "Build approval is required."
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11.9'
      - name: Prepare validated Python
        shell: pwsh
        run: |
          python -m pip install uv==0.12.23
          uv python install 3.11.17 --no-bin
          uv venv .venv --python 3.11.17 --managed-python --seed
          "$env:GITHUB_WORKSPACE/.venv/Scripts" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - run: python --version
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pip check
      - run: python tools/public_snapshot.py --check
      - name: Read application version
        id: version
        shell: pwsh
        run: |
          $releaseVersion = python -c "from app.version import __version__; print(__version__)"
          "value=$releaseVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - run: python -m unittest discover -s tests -v
      - run: python tools/smoke_test.py
      - run: python build_release.py --output dist
      - run: python tools/smoke_test.py dist/OncaAlumnos.exe
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: OncaAlumnos-Windows-v${{ steps.version.outputs.value }}-review
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/OncaAlumnos.exe
            dist/SHA256SUMS.txt
            dist/build-manifest.json
            dist/THIRD_PARTY_NOTICES/**
            dist/THIRD_PARTY_NOTICES.md
            dist/LICENSE
            dist/NOTICE
